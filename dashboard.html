<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeBridge NG – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-100">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-gray-900 text-white w-64 hidden md:flex flex-col fixed inset-y-0">
      <div class="p-6 text-2xl font-bold border-b border-gray-800">
        <span class="text-green-400">Home</span>Bridge
      </div>
      <nav class="flex-1 mt-6 px-4 space-y-2" id="navItems">
        <!-- dynamic per role -->
      </nav>
      <div class="p-4 border-t border-gray-800">
        <div id="userInfo" class="text-sm"></div>
        <button id="logoutBtn" class="mt-2 text-red-400 text-sm w-full text-left">Logout</button>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black/50 z-20 hidden" onclick="toggleSidebar()"></div>
    <aside id="mobileSidebar" class="fixed inset-y-0 left-0 w-64 bg-gray-900 text-white z-30 transform -translate-x-full transition-transform duration-200">
      <!-- same content, can duplicate with JS injection -->
    </aside>

    <!-- Main area -->
    <div class="flex-1 md:ml-64 flex flex-col h-screen overflow-hidden">
      <!-- Top bar -->
      <header class="bg-white shadow-sm p-4 flex items-center justify-between">
        <button class="md:hidden text-2xl" onclick="toggleSidebar()">☰</button>
        <h1 id="pageTitle" class="text-xl font-bold text-gray-800">Overview</h1>
        <div class="flex items-center gap-2">
          <span id="roleBadge" class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-semibold"></span>
          <span id="avatarPlaceholder" class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center"></span>
        </div>
      </header>

      <!-- Content scroll area -->
      <main id="content" class="flex-1 overflow-y-auto p-6">
        <!-- dynamic page content injected by JS -->
      </main>
    </div>
  </div>

  <!-- Modal container for forms -->
  <div id="modalContainer"></div>

  <!-- Toast container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 space-y-2 z-50"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/applications.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
